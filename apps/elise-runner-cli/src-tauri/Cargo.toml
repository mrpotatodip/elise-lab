[package]
name = "elise-runner"
version = "0.1.0"
description = "Elise Runner: runs Scans on this computer"
edition = "2021"

[lib]
name = "elise_runner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
elise-runner-core = { path = "../core" }
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
