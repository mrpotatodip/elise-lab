[package]
# Not `elise-runner`: that is the headless program's binary, and both land in one `target` folder.
# `mainBinaryName` in tauri.conf.json keeps the bundled app's executable named `elise-runner`.
name = "elise-runner-desktop"
version = "0.3.0"
description = "Elise Runner: runs Scans on this computer"
edition = "2021"

[lib]
name = "elise_runner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
elise-runner-core = { path = "../core" }
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
