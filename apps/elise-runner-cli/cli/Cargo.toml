[package]
name = "elise-runner-cli"
version = "0.8.0"
description = "The headless Elise Runner: pairs and runs Scans from a terminal"
edition = "2021"

[[bin]]
name = "elise"
path = "src/main.rs"

# The stand-in for git, claude, node and the browser openers in the integration tests (see its header).
[[bin]]
name = "elise-stub-tool"
path = "test-stubs/stub_tool.rs"
test = false
doc = false

[dependencies]
elise-runner-core = { path = "../core" }
dirs = "7"
serde_json = "1"
tokio = { version = "1.54.1", features = ["rt", "time", "signal", "macros"] }

[lints]
workspace = true

[dev-dependencies]
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
