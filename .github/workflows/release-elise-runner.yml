name: release-elise-runner

on:
  push:
    tags: ["elise-runner-v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { runner: macos-15, asset: elise-runner-darwin-arm64 }
          - { runner: macos-15-intel, asset: elise-runner-darwin-x64 }
          - { runner: ubuntu-24.04, asset: elise-runner-linux-x64 }
          - { runner: ubuntu-24.04-arm, asset: elise-runner-linux-arm64 }
          - { runner: windows-2022, asset: elise-runner-windows-x64.exe }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: apps/elise-runner-cli
    steps:
      - uses: actions/checkout@v4
      - name: Linux build libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
        working-directory: .
      - run: rustup show
      - name: Tag matches the crate version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' cli/Cargo.toml | head -n 1)
          test "${GITHUB_REF_NAME}" = "elise-runner-v${version}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match cli/Cargo.toml version ${version}" >&2
            exit 1
          }
      - run: cargo build --release --locked -p elise-runner-cli --bin elise-runner
      - name: Name the binary
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/elise-runner.exe "${{ matrix.asset }}"
          else
            cp target/release/elise-runner "${{ matrix.asset }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: apps/elise-runner-cli/${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "elise-runner ${GITHUB_REF_NAME#elise-runner-v}" \
            --generate-notes
